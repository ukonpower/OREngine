# main への push で GitHub Pages（gh-pages ブランチ）のサイトルートを更新する
# 配置はミラー構成: ルート = エディタデモ（editor:build） / storybook/ = Storybook
# pr-preview/ は pr-preview workflow が管理しているので消さない
name: deploy-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# gh-pages への書き込みを直列化する（cancelすると pr-preview 等の書き込みを潰すのでキュー待ちにする）
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build editor demo
        run: npm run editor:build
        env:
          BASE_PATH: /OREngine/
          # CI には shader_minifier が無い。minify はカナリア用途なのでスキップする
          SKIP_SHADER_MINIFIER: "true"
      - name: Build storybook
        run: npm run storybook:build
        env:
          SKIP_SHADER_MINIFIER: "true"
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r demo-webgl/dist/static/. site/
          # static ビルドのエントリは static.html なので Pages のルートで開けるようにする
          mv site/static.html site/index.html
          cp -r storybook-static site/storybook
          touch site/.nojekyll
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
          force: false
